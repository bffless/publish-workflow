name: 'Publish a BFFless Workflow implementation'
description: >-
  Publish an implementation with `npx @bffless/workflow publish` (index → prepare the
  alias-named rule set + /w/<alias>/ forwarder → rules push → deploy + attach), or tear a
  preview down. The alias defaults to the implementation's .bffless/workflow.json.
author: 'bffless'

branding:
  icon: 'git-branch'
  color: 'blue'

inputs:
  mode:
    description: 'publish (build + deploy + attach) or teardown (delete a preview and detach it)'
    required: false
    default: 'publish'
  alias:
    description: >-
      The implementation alias, e.g. "hello". Lowercase, letter-initial, hyphenated.
      Optional in publish mode: it defaults to the `alias` in the identity file beside the
      workflows directory (`<dirname of workflows>/workflow.json`, i.e. the standard
      `.bffless/workflow.json`). Required in teardown mode — the alias to delete is a
      preview (`<impl>-pr-<n>`), never the production alias the identity file names.
    required: false
    default: ''
  api-url:
    description: 'Base URL of the BFFless instance, e.g. https://j5s.dev'
    required: true
  api-key:
    description: 'API key for authentication (X-API-Key header)'
    required: true
  repository:
    description: 'The harness project, owner/name — where the alias and rule set live'
    required: true
  path:
    description: 'Built bundle directory (also the --path of `workflow publish`)'
    required: false
    default: 'dist'
  workflows:
    description: >-
      Directory of authored workflow YAML. Its parent also locates the identity file
      (`<dirname>/workflow.json`) the `alias`/`harness-alias` defaults are read from.
    required: false
    default: '.bffless/workflows'
  rules:
    description: 'The implementation rule-set directory (default: .bffless/proxy-rules/<alias>)'
    required: false
    default: ''
  harness-alias:
    description: >-
      The harness alias that carries the union of implementation rule sets. Defaults to
      the identity file's `harness`, and to "workflow" when there is no identity file.
    required: false
    default: ''
  workflow-version:
    description: 'npm range for @bffless/workflow, the CLI this action wraps'
    required: false
    default: '^1.0.0'
  preview:
    description: >-
      Teardown mode only: opt in to tearing down an alias that does not match the
      preview grammar `<impl>-pr-<n>`. Without it, teardown refuses before any request —
      the contributor-role key can repoint any alias on the harness project.
    required: false
    default: 'false'

  # --- v1 inputs the wrapped CLI cannot carry (see "Reject inputs v2 cannot carry") ---
  # These are declared ONLY so a v1 caller that sets one fails loudly on upgrade. Dropping
  # them outright would make GitHub emit a warning and run anyway, silently changing what
  # gets published (`prune: false` most dangerously of all). Each one disappears from this
  # list the moment `@bffless/workflow publish` grows the flag behind it.
  name:
    description: 'REMOVED in v2 — `workflow publish` has no --name; setting it fails the run.'
    required: false
    default: ''
  description:
    description: 'REMOVED in v2 — `workflow publish` has no --description; setting it fails the run.'
    required: false
    default: ''
  target-url:
    description: 'REMOVED in v2 — `workflow publish` always forwards in-process; setting it fails the run.'
    required: false
    default: ''
  backend-url:
    description: 'REMOVED in v2 — `workflow publish` pins http://localhost:3000; changing it fails the run.'
    required: false
    default: 'http://localhost:3000'
  prune:
    description: 'REMOVED in v2 — `workflow publish` always prunes; `prune: false` fails the run.'
    required: false
    default: 'true'
  lint-version:
    description: 'REMOVED in v2 — the linter is pinned by @bffless/workflow; use `workflow-version`.'
    required: false
    default: ''

outputs:
  alias:
    description: 'The resolved implementation alias (the input, or the identity file''s)'
    value: ${{ steps.cfg.outputs.alias }}
  harness-alias:
    description: 'The resolved harness alias (the input, the identity file''s `harness`, or "workflow")'
    value: ${{ steps.cfg.outputs.harness-alias }}
  index:
    description: 'Publish mode: path of the written index.json'
    value: ${{ steps.cfg.outputs.index }}
  detached:
    description: 'Teardown mode: whether the harness alias was detached from the preview rule set'
    value: ${{ steps.teardown.outputs.detached }}
  deleted-alias:
    description: 'Teardown mode: whether the preview alias was deleted'
    value: ${{ steps.teardown.outputs.deleted-alias }}
  deleted-rule-set:
    description: 'Teardown mode: whether the preview rule set was deleted'
    value: ${{ steps.teardown.outputs.deleted-rule-set }}

runs:
  using: composite
  steps:
    # Ungated (runs whatever `mode` is) so a typo like `mode: Teardown` fails loudly here
    # instead of every later step's `if:` silently skipping it — a green no-op run.
    - name: Validate mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$MODE" in
          publish|teardown) ;;
          *) echo "::error::input \`mode\` must be \"publish\" or \"teardown\" (got \"$MODE\")"; exit 1 ;;
        esac

    # v2 publishes through `npx @bffless/workflow publish`, whose flag list (README
    # "publish — index, prepare, sync, deploy, attach") has no counterpart for these. A
    # value set here would be accepted and then have no effect, so refuse it instead:
    # a failed run with a message beats a bundle that quietly says the wrong thing.
    - name: Reject inputs v2 cannot carry
      if: inputs.mode == 'publish'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        DESCRIPTION: ${{ inputs.description }}
        TARGET_URL: ${{ inputs.target-url }}
        BACKEND_URL: ${{ inputs.backend-url }}
        PRUNE: ${{ inputs.prune }}
        LINT_VERSION: ${{ inputs.lint-version }}
      run: |
        set -euo pipefail
        FAILED=0
        fail() { echo "::error::$1"; FAILED=1; }
        SEE='See the v1 → v2 migration table in this action'"'"'s README.'
        if [ -n "$NAME" ]; then
          fail "input \`name\` was removed in v2: \`workflow publish\` has no --name, so the display name would be dropped from index.json and the Implementations screen would show the alias instead. Blocked on the CLI; stay on @v1 until it lands. $SEE"
        fi
        if [ -n "$DESCRIPTION" ]; then
          fail "input \`description\` was removed in v2: \`workflow publish\` has no --description, so the line would be dropped from index.json. Blocked on the CLI; stay on @v1 until it lands. $SEE"
        fi
        if [ -n "$TARGET_URL" ]; then
          fail "input \`target-url\` was removed in v2: \`workflow publish\` always points the /w/<alias>/* forwarder at the alias served in-process by the CE backend. To forward to a real domain instead, stay on @v1. $SEE"
        fi
        if [ "$BACKEND_URL" != 'http://localhost:3000' ]; then
          fail "input \`backend-url\` was removed in v2: \`workflow publish\` pins the backend's own address to http://localhost:3000. $SEE"
        fi
        if [ "$PRUNE" != 'true' ]; then
          fail "input \`prune\` was removed in v2: \`workflow publish\` always passes --prune to \`bffless rules push\`, so \`prune: false\` would prune anyway. $SEE"
        fi
        if [ -n "$LINT_VERSION" ]; then
          fail "input \`lint-version\` was removed in v2: the linter version is pinned by @bffless/workflow itself. Pin the CLI with \`workflow-version\` instead. $SEE"
        fi
        [ "$FAILED" = 0 ] || exit 1

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Defaults that depend on another input — or on a file in the checkout — cannot live in
    # `inputs.*.default`, so they are resolved once here and every later step reads the
    # resolved value. Ungated: teardown needs the resolved harness alias too.
    - name: Resolve inputs
      id: cfg
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ALIAS: ${{ inputs.alias }}
        HARNESS_ALIAS: ${{ inputs.harness-alias }}
        RULES: ${{ inputs.rules }}
        OUT: ${{ inputs.path }}
        WORKFLOWS: ${{ inputs.workflows }}
        REPOSITORY: ${{ inputs.repository }}
        API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        # $GITHUB_OUTPUT is line-oriented, so a newline inside a value would let that value
        # forge further `key=value` lines. Reject one outright rather than sanitising it —
        # none of these inputs has a legitimate multi-line form.
        reject_newline() {
          case "$2" in
            *$'\n'*) echo "::error::input \`$1\` must not contain a newline"; exit 1 ;;
          esac
        }
        reject_newline alias "$ALIAS"
        reject_newline harness-alias "$HARNESS_ALIAS"
        reject_newline rules "$RULES"
        reject_newline path "$OUT"
        reject_newline workflows "$WORKFLOWS"
        reject_newline repository "$REPOSITORY"
        reject_newline api-url "$API_URL"

        # The identity file is `.bffless/workflow.json` — the SIBLING of `.bffless/workflows`.
        # Deriving it from the `workflows` input (rather than assuming the checkout root)
        # is what makes a nested implementation work: `workflow publish` reads the identity
        # file relative to its own cwd, which here is always $GITHUB_WORKSPACE, so a package
        # at packages/hello/ would never be found. Resolving it here and passing --alias
        # explicitly means the CLI never has to look.
        IDENTITY="$(dirname "$WORKFLOWS")/workflow.json"
        ident() {
          [ -f "$IDENTITY" ] || return 0
          node -e 'const fs=require("node:fs");let id={};try{id=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};const v=id[process.argv[2]];process.stdout.write(typeof v==="string"?v:"")' \
            "$IDENTITY" "$1" 2>/dev/null || true
        }

        # Teardown never defaults the alias: the identity file names the PRODUCTION alias,
        # and teardown deletes what it is given. An omitted alias must fail, not resolve.
        if [ -z "$ALIAS" ] && [ "$MODE" = 'publish' ]; then ALIAS="$(ident alias)"; fi
        [ -n "$HARNESS_ALIAS" ] || HARNESS_ALIAS="$(ident harness)"
        [ -n "$HARNESS_ALIAS" ] || HARNESS_ALIAS='workflow'

        if [ -z "$ALIAS" ]; then
          if [ "$MODE" = 'teardown' ]; then
            echo "::error::input \`alias\` is required in teardown mode — it names the preview to delete and is never defaulted from $IDENTITY (which names the production alias)"
          else
            echo "::error::input \`alias\` is required: it was not given and $IDENTITY does not exist or does not name a string \`alias\`. Pass \`alias:\`, or point \`workflows:\` at the implementation's own .bffless/workflows"
          fi
          exit 1
        fi

        # Both values land in $GITHUB_OUTPUT and on the CLI's command line; the grammar
        # (which an alias must satisfy anyway — it becomes a hostname label) also rules out
        # every character that could forge an output line or a flag.
        assert_alias() {
          if ! [[ "$2" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::$1 \"$2\" is not a valid alias: expected ^[a-z][a-z0-9-]*\$"
            exit 1
          fi
        }
        assert_alias alias "$ALIAS"
        assert_alias harness-alias "$HARNESS_ALIAS"

        {
          echo "alias=$ALIAS"
          echo "harness-alias=$HARNESS_ALIAS"
          echo "index=$OUT/.bffless/workflows/index.json"
        } >> "$GITHUB_OUTPUT"

    # The whole publish path, in one call: `workflow publish` runs index → prepare (the
    # alias-named set + generated /w/<alias>/* forwarder) → `bffless rules push` → zip
    # upload + attach to the harness alias. Its prepare/attach are ports of this action's
    # own v1 scripts, behaviour-pinned against the fixtures this repo used to carry, so v2
    # is a re-pointing rather than a re-implementation. A failing lint is never published.
    - name: Publish the implementation
      id: publish
      if: inputs.mode == 'publish'
      shell: bash
      env:
        # The key reaches the CLI through the environment only — never argv, where it would
        # land in the runner's process list (the CLI reads BFFLESS_API_KEY and nothing else).
        BFFLESS_API_KEY: ${{ inputs.api-key }}
        WORKFLOW_VERSION: ${{ inputs.workflow-version }}
        API_URL: ${{ inputs.api-url }}
        REPOSITORY: ${{ inputs.repository }}
        ALIAS: ${{ steps.cfg.outputs.alias }}
        HARNESS_ALIAS: ${{ steps.cfg.outputs.harness-alias }}
        OUT: ${{ inputs.path }}
        WORKFLOWS: ${{ inputs.workflows }}
        RULES: ${{ inputs.rules }}
      run: |
        set -euo pipefail
        args=(publish
          --api-url "$API_URL"
          --project "$REPOSITORY"
          --alias "$ALIAS"
          --harness-alias "$HARNESS_ALIAS"
          --path "$OUT"
          --workflows "$WORKFLOWS")
        # Omitted, not empty: the CLI's own default is .bffless/proxy-rules/<alias>, and
        # `--rules ''` would be a usage error rather than "use the default".
        if [ -n "$RULES" ]; then args+=(--rules "$RULES"); fi
        npx --yes "@bffless/workflow@$WORKFLOW_VERSION" "${args[@]}"

    # Teardown stays in-repo: preview lifecycle is CI's concern, and the CLI deliberately
    # has no teardown verb (an authoring CLI never deletes someone's alias).
    - name: Tear down the preview
      id: teardown
      if: inputs.mode == 'teardown'
      shell: bash
      env:
        BFFLESS_API_KEY: ${{ inputs.api-key }}
        API_URL: ${{ inputs.api-url }}
        REPOSITORY: ${{ inputs.repository }}
        HARNESS_ALIAS: ${{ steps.cfg.outputs.harness-alias }}
        ALIAS: ${{ steps.cfg.outputs.alias }}
        PREVIEW: ${{ inputs.preview }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/scripts/teardown.mjs" --api-url "$API_URL" --repository "$REPOSITORY" \
          --harness-alias "$HARNESS_ALIAS" --alias "$ALIAS" --preview "$PREVIEW" \
          >> "$GITHUB_OUTPUT"
